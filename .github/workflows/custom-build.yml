name: Custom Build (Disable Folder Icon Preview)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows Installer (SkipTests)
        shell: pwsh
        run: ./scripts/build_release_ci.ps1 -Channel 'windows' -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: PulseSetup-windows-no-folder-preview
          path: dist/PulseSetup-*.exe
          if-no-files-found: error
